# Opt-in pre-commit hooks.
# To activate: bun run hooks:install
# To deactivate: bun run hooks:uninstall
#
# These hooks are NOT auto-installed. Each developer chooses whether to use them.

no_auto_install: true

pre-commit:
  parallel: false
  commands:
    secrets:
      run: bun run secrets:check:staged
    lint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: bun --bun oxlint -c oxlint.config.ts --deny-warnings --no-error-on-unmatched-pattern --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,tsx,js,jsx,json,css,md}"
      run: bun --bun oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    workspace:
      run: bun run lint:ws
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
    test:
      run: bun run test
    format:
      run: bun run format:check
