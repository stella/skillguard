name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@v1.2.0 # zizmor: ignore[unpinned-uses]
        with:
          release-paths: |
            packages/cli/**
            packages/core/**
            packages/rules/**
            packages/sarif/**
          generated-paths: |
            bun.lock
            packages/cli/CHANGELOG.md
            packages/cli/package.json
            packages/core/CHANGELOG.md
            packages/core/package.json
            packages/rules/CHANGELOG.md
            packages/rules/package.json
            packages/sarif/CHANGELOG.md
            packages/sarif/package.json
          package-files: |
            packages/cli/package.json
            packages/core/package.json
            packages/rules/package.json
            packages/sarif/package.json
          version-file: bun.lock

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:ws
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run knip
      - run: bun run build
      - run: bun --filter @stll/skillguard intent:validate
      - run: bun run pack:verify
