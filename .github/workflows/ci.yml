name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@c47bb87cc82047b5fdc2540983148d4e3efa9a37 # v1.3.0
        with:
          release-paths: |
            packages/cli/**
            packages/core/**
            packages/rules/**
            packages/sarif/**
          generated-paths: |
            bun.lock
            packages/cli/CHANGELOG.md
            packages/cli/package.json
            packages/core/CHANGELOG.md
            packages/core/package.json
            packages/rules/CHANGELOG.md
            packages/rules/package.json
            packages/sarif/CHANGELOG.md
            packages/sarif/package.json
          package-files: |
            packages/cli/package.json
            packages/core/package.json
            packages/rules/package.json
            packages/sarif/package.json
          version-file: bun.lock

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || 'unavailable-toolchain-base' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      # Bun validates the resolved graph but does not refresh or validate cached
      # workspace self-versions. Release automation uses this same script in
      # byte-preserving --write mode; CI keeps it in check-only mode.
      - name: Lockfile workspace-version check
        run: bun run check:lockfile-versions
      - run: bun run lint:ws
      - run: bun run typecheck
      - name: Verify typecheck rejects a seeded error
        shell: bash
        run: |
          fixture=packages/core/src/typecheck-proof.ts
          test ! -e "$fixture"
          trap 'rm -f "$fixture"' EXIT
          printf 'export const typecheckProof: number = "wrong";\n' > "$fixture"
          if bun run typecheck > "$RUNNER_TEMP/typecheck-proof.log" 2>&1; then
            cat "$RUNNER_TEMP/typecheck-proof.log"
            echo "Typecheck accepted a seeded type error"
            exit 1
          fi
          cat "$RUNNER_TEMP/typecheck-proof.log"
          grep -q 'TS2322' "$RUNNER_TEMP/typecheck-proof.log"
          rm "$fixture"
          trap - EXIT
          bun run typecheck
      - name: Detect toolchain changes
        id: toolchain
        run: |
          bunx --no-install stll-toolchain-changed --since "$BASE_REF" > "$RUNNER_TEMP/toolchain-changes.json"
          node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (typeof result.changed !== "boolean") throw new Error("Missing toolchain changed result"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed}\n`);' "$RUNNER_TEMP/toolchain-changes.json"
      - run: bun run check:typecheck-parity
        if: steps.toolchain.outputs.changed == 'true'
      - run: bun test scripts/tooling-adoption.test.ts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run knip
      - run: bun run build
      - run: bun --filter @stll/skillguard intent:validate
      - run: bun run pack:verify
