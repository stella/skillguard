name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  version:
    name: Maintain Version Packages PR
    permissions:
      contents: read
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@caa3ee1c2d02ef807994fdd3907c55ba104aff00
    with:
      bun-version-file: package.json
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
