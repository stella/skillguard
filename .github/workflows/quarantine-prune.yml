name: Package quarantine prune

on:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/skillguard'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@0dbf135e44f23ba69cb434b12eca5abea1456be4
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
