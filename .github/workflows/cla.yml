name: CLA Assistant

on:
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]
  pull_request_target: # zizmor: ignore[dangerous-triggers] delegates to pinned reusable CLA workflow; never check out PR code here
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (
        github.event_name == 'merge_group'
        || github.event_name == 'pull_request_target'
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    uses: stella/.github/.github/workflows/cla.yml@0dbf135e44f23ba69cb434b12eca5abea1456be4
    with:
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],stella-provenance-updater[bot],google-labs-jules[bot],cursoragent
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
