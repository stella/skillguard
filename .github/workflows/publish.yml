name: Publish

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      publish:
        description: Publish missing package versions after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: Build and pack ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, sarif, rules, cli]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build and pack
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          mkdir -p release-artifacts
          (
            cd "packages/${PACKAGE}"
            bun pm pack --destination "$GITHUB_WORKSPACE/release-artifacts"
          )

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ matrix.package }}
          path: release-artifacts/*.tgz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish packages
    needs: pack
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: write
      id-token: write
    # npm trusted publishing authorizes this caller workflow filename.
    uses: stella/.github/.github/workflows/npm-independent-release.yml@608900bde4c0847e5224a0dd93a5cc4c911960d6 # v1.3.0
    with:
      artifact-pattern: npm-tarball-*
      package-files: |
        packages/core/package.json
        packages/sarif/package.json
        packages/rules/package.json
        packages/cli/package.json
