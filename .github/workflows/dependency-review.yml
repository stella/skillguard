name: Dependency Review

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'merge_group'
      || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency graph support
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "unsupported"')"
          if [[ "$status" = "enabled" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Dependency graph is not enabled or supported on this repository; skipping dependency review."

      - name: Dependency Review
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action derives both refs from a pull_request payload on its own;
          # a merge group carries them under its own event key.
          base-ref: ${{ github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event.merge_group.head_sha || '' }}
          fail-on-severity: high
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            0BSD,
            BlueOak-1.0.0,
            Unlicense,
            CC0-1.0,
            CC-BY-4.0,
            MIT-0,
            MPL-2.0,
            Python-2.0,
            Zlib
          comment-summary-in-pr: always
