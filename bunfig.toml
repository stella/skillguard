[install]
linker = "isolated"
# 5-day quarantine: reject package versions published less than 5 days ago.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  "bun-types", # quarantine-expires: 2026-10-27T10:17:50.170Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-10-17T00:00:00.000Z
  "@stll/oxlint-plugin", # quarantine-excluded-since: 2026-10-17T00:00:00.000Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-10-17T00:00:00.000Z
]

[fmt]
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
  "**/*.gen.*",
  "**/*.min.*",
  "**/.cache/**",
  "**/dist/**",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true
